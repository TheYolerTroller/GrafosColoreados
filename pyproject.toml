[project]
name = "grafoscoloreados"
version = "0.1.0"
description = "Aplicación interactiva para la coloración de grafos no dirigidos mediante el algoritmo voraz (Welsh-Powell)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "pyqt6>=6.12.0",
]

[project.scripts]
grafoscoloreados = "grafoscoloreados:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
